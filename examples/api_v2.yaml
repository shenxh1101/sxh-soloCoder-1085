name: UserService
version: "2.0.0"
base_url: https://api.example.com/v2
description: User management service API v2

endpoints:
  - path: /users
    method: GET
    module: users
    summary: List all users with filters
    description: Returns a paginated list of users with filtering support
    parameters:
      - name: page
        location: query
        type: integer
        required: false
        description: Page number
        default: 1
      - name: limit
        location: query
        type: integer
        required: false
        description: Items per page
        default: 20
      - name: status
        location: query
        type: string
        required: true
        description: Filter by user status (active, inactive)
    responses:
      - status_code: 200
        content_type: application/json
        description: Successful response
        fields:
          - name: items
            type: array
            required: true
            description: List of users
          - name: total_count
            type: integer
            required: true
            description: Total count
          - name: page_info
            type: object
            required: false
            description: Pagination metadata
        example:
          items:
            - id: 1
              name: "John Doe"
              email: "john@example.com"
              status: "active"
          total_count: 1

  - path: /users/{id}
    method: GET
    module: users
    summary: Get user by ID
    description: Returns a single user with extended profile
    parameters:
      - name: id
        location: path
        type: string
        required: true
        description: User UUID
    responses:
      - status_code: 200
        content_type: application/json
        description: User object
        fields:
          - name: id
            type: string
            required: true
            description: User UUID
          - name: name
            type: string
            required: true
          - name: email
            type: string
            required: true
          - name: status
            type: string
            required: true
          - name: created_at
            type: string
            required: true
        example:
          id: "a1b2c3-d4e5-f6g7"
          name: "John Doe"
          email: "john@example.com"
          status: "active"
          created_at: "2024-01-15T10:30:00Z"

  - path: /users
    method: POST
    module: users
    summary: Create a new user
    parameters: []
    request:
      content_type: application/json
      fields:
        - name: name
          type: string
          required: true
          description: Full name
        - name: email
          type: string
          required: true
          description: Email address
        - name: status
          type: string
          required: false
          description: Initial status
          default: "active"
      example:
        name: "Jane Smith"
        email: "jane@example.com"
        status: "active"
    responses:
      - status_code: 201
        content_type: application/json
        description: Created user
        fields:
          - name: id
            type: string
            required: true
        example:
          id: "h8i9j0-k1l2-m3n4"

  - path: /users/{id}
    method: PATCH
    module: users
    summary: Update user partial fields
    description: Update specific fields of a user
    parameters:
      - name: id
        location: path
        type: string
        required: true
        description: User UUID
    request:
      content_type: application/json
      fields:
        - name: name
          type: string
          required: false
        - name: email
          type: string
          required: false
        - name: status
          type: string
          required: false
    responses:
      - status_code: 200
        content_type: application/json
        description: Updated user
        fields:
          - name: id
            type: string
            required: true

  - path: /auth/login
    method: POST
    module: auth
    summary: User login
    description: Authenticate user and return token (deprecated)
    deprecated: true
    request:
      content_type: application/json
      fields:
        - name: username
          type: string
          required: true
        - name: password
          type: string
          required: true
      example:
        username: "john"
        password: "secret123"
    responses:
      - status_code: 200
        content_type: application/json
        description: Login successful
        fields:
          - name: token
            type: string
            required: true
          - name: expires_in
            type: integer
            required: true
        example:
          token: "eyJhbGciOiJ..."
          expires_in: 3600

  - path: /auth/token
    method: POST
    module: auth
    summary: Obtain access token
    description: New authentication endpoint with OAuth2 support
    request:
      content_type: application/json
      fields:
        - name: grant_type
          type: string
          required: true
          description: "password or refresh_token"
        - name: username
          type: string
          required: false
        - name: password
          type: string
          required: false
        - name: refresh_token
          type: string
          required: false
    responses:
      - status_code: 200
        content_type: application/json
        description: Token response
        fields:
          - name: access_token
            type: string
            required: true
          - name: refresh_token
            type: string
            required: true
          - name: expires_in
            type: integer
            required: true
          - name: token_type
            type: string
            required: true
