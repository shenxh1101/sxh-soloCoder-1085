name: OrderService
version: "2.0.0"
base_url: https://api.example.com/orders/v2
description: Order management service v2 with multi-currency support

endpoints:
  - path: /orders
    method: GET
    module: orders
    summary: List orders with filters
    description: List all orders with rich filtering
    parameters:
      - name: cursor
        location: query
        type: string
        required: false
        description: Pagination cursor
      - name: limit
        location: query
        type: integer
        required: false
        default: 50
      - name: status
        location: query
        type: string
        required: true
        description: Filter by status (required)
    responses:
      - status_code: 200
        content_type: application/json
        description: List of orders
        fields:
          - name: items
            type: array
            required: true
          - name: total
            type: integer
            required: true
          - name: next_cursor
            type: string
            required: false
        example:
          items: [{order_id: "ORD-0001", total_amount: {value: 99.0, currency: "USD"}}]
          total: 1

  - path: /orders/{id}
    method: GET
    module: orders
    summary: Get order by ID
    parameters:
      - name: id
        location: path
        type: string
        required: true
        description: Order ID string format ORD-XXXX
    responses:
      - status_code: 200
        content_type: application/json
        description: Order object
        fields:
          - name: order_id
            type: string
            required: true
          - name: total_amount
            type: object
            required: true
          - name: user_uuid
            type: string
            required: true
          - name: status
            type: string
            required: true
          - name: created_at
            type: string
            required: true
        example:
          order_id: "ORD-0001"
          total_amount: {value: 99.0, currency: "USD"}
          user_uuid: "a1b2-c3d4"
          status: "paid"
          created_at: "2026-01-15T10:30:00Z"

  - path: /orders/{id}
    method: PATCH
    module: orders
    summary: Update order status
    parameters:
      - name: id
        location: path
        type: string
        required: true
    request:
      content_type: application/json
      fields:
        - name: status
          type: string
          required: true
      example:
        status: "shipped"
    responses:
      - status_code: 200
        fields:
          - name: order_id
            type: string
            required: true

  - path: /payments
    method: POST
    module: payments
    summary: Create payment (multi-method)
    request:
      content_type: application/json
      fields:
        - name: order_id
          type: string
          required: true
        - name: method
          type: string
          required: true
          description: credit_card, alipay, wechat, crypto
        - name: currency
          type: string
          required: false
          default: "USD"
      example:
        order_id: "ORD-0001"
        method: "alipay"
        currency: "CNY"
    responses:
      - status_code: 201
        content_type: application/json
        fields:
          - name: transaction_id
            type: string
            required: true
        example:
          transaction_id: "TXN-abc123"

  - path: /refunds
    method: POST
    module: payments
    summary: Request refund
    request:
      content_type: application/json
      fields:
        - name: order_id
          type: string
          required: true
        - name: reason
          type: string
          required: true
    responses:
      - status_code: 201
        fields:
          - name: refund_id
            type: string
            required: true
