[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apichangelog"
version = "0.1.0"
description = "API Change Log Tool - Track, compare, and document API interface changes"
authors = [
    {name = "API Changelog Team"}
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "rich>=13.0.0",
]

[project.scripts]
apichangelog = "apichangelog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apichangelog*"]
